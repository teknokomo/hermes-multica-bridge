name: hermes-multica-bridge
version: "0.7.0"
manifest_version: 2
requires_hermes: ">=0.22.4"
description: "Bridge between Hermes and Multica with scoped Workspace routes, operator grants, completion wake, and an opt-in canonical-agent Runtime Router."
author: Universo
license: "LicenseRef-Omsk-Open-License-Basic-Attribution"
kind: standalone
platforms:
  - linux
provides_tools:
  - multica_list_routes
  - multica_send_task
  - multica_check_task_result
  - multica_workspace_send
  - multica_workspace_get
  - multica_workspace_comment
  - multica_workspace_update
  - multica_route_create
  - multica_runtime_task_create
  - multica_runtime_cancel
  - multica_runtime_status
  - multica_runtime_bindings_list
  - multica_runtime_binding_set
  - multica_runtime_queue_list
tags:
  - multica
  - kanban
  - integration
config_schema:
  registry:
    type: dict
    label: "ConnectionRegistry"
    description: "Структурированный реестр подключений, рабочих пространств, маршрутов и точечных операторских разрешений. Секреты в реестре не хранятся."
    default:
      connections: []
      workspaces: []
      routes: []
      operator_grants: []
      route_grants: []
  runtime_router:
    type: dict
    label: "Runtime Router"
    description: "Операторская политика переключения runtime canonical agent. По умолчанию выключена."
    default:
      enabled: false
      state_path: "${HERMES_HOME}/plugin-data/hermes-multica-bridge/runtime-router.sqlite3"
      worker_profile: "default"
      tick_seconds: 30
      lease_seconds: 900
      unbound_policy: "reject"
      kanban_mirror: false
      connectors: {}
      instances: {}
      agents: {}
      operators: []
  condition_wake:
    type: dict
    label: "Approval-ready condition wake"
    description: "По умолчанию выключено. Включать только после проверки на целевой сборке, что native wake/run не доставляется в чат напрямую; финальное сообщение отправляет notify."
    default:
      enabled: false
      native_delivery_suppressed: false
